      THESIS: This site is a cadastral survey plan of Lonhe, not a brochure about it.
      It refuses the sector default (drone photo, "Cultivating a Sustainable Future",
      three icon cards). A one-year-old company has no track record; it has measured
      ground, so the sheet shows the measurement.
      OWN-WORLD: Warm drafting paper #F6F2E8, survey ink green #1A3F1C dominant,
      deep-green title-block plates #12300F as counterweights, terracotta for the
      seasonal tally. Gold appears ONLY on a control or a measured value. Petrona
      display / Archivo drafting lettering. Ruled cells, hatch, leader lines, station
      marks. No cards, no shadows, no stock icons.
      STORY: An export buyer or bank learns the varietal, the scale and the place in
      one viewport, sees the figures are staged and honest, and emails general@royalseed.com.
      FIRST VIEWPORT: Ruled sheet with corner registration marks. Left title block:
      headline, standfirst, gold-ruled "Falar connosco". Right: the parcel drawn with
      the 500 ha block at its true 23.58% area share, north arrow, scale bar, leader
      annotations. Under it the gold phase axis, the only control on the sheet.
      FORM: The Cadastral Plan — candidate 1 of my ordered list, taken as the user's
      pick over the dealt assignment. Seed key 04047709.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
